<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; color: #333; }
    h1   { color: #2C3E50; border-bottom: 2px solid #4A90D9; padding-bottom: 8px; }
    h2   { color: #4A90D9; margin-top: 24px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th   { background: #4A90D9; color: white; padding: 8px 12px; text-align: left; }
    td   { padding: 7px 12px; border-bottom: 1px solid #eee; }
    tr:nth-child(even) { background: #f9f9f9; }
    .insights { background: #EAF4FB; border-left: 4px solid #4A90D9;
                padding: 12px 16px; margin-top: 16px; border-radius: 4px; }
    .footer { margin-top: 40px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <p><strong>Period:</strong> {{ period }} &nbsp;|&nbsp; <strong>Generated:</strong> {{ generated_date }}</p>

  <h2>Summary Data</h2>
  {{ table_html }}

  <h2>Key Insights</h2>
  <div class="insights">
    <pre style="white-space:pre-wrap; font-family:Arial; font-size:13px;">{{ analysis }}</pre>
  </div>

  <div class="footer">
    This report was generated automatically by the Agentic Sales Reporting System.
    All figures sourced directly from the Superstore database.
  </div>
</body>
</html>
